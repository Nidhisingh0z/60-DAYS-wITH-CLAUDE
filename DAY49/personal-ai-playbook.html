<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Playbook — Software Engineering</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#F4F5F1;
  --surface:#FFFFFF;
  --surface-2:#EDEFEA;
  --ink:#14181F;
  --ink-soft:#4B5566;
  --ink-faint:#8A93A3;
  --accent:#2F5FF6;
  --accent-ink:#1E3FBD;
  --accent-soft:#E8EDFF;
  --amber:#C97A1F;
  --amber-soft:#FBEBD6;
  --success:#1F8F5F;
  --success-soft:#E1F5EB;
  --danger:#C4432C;
  --danger-soft:#FBE7E2;
  --line:#DADDD3;
  --line-strong:#C3C7BA;
  --shadow:0 1px 2px rgba(20,24,31,.04), 0 8px 24px -12px rgba(20,24,31,.12);
  --shadow-lg:0 4px 12px rgba(20,24,31,.06), 0 24px 48px -20px rgba(20,24,31,.22);
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:18px;
  --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'Consolas', monospace;
  --sidebar-w:236px;
  --dur:180ms;
}
html[data-theme="dark"]{
  --bg:#0D1015;
  --surface:#161A22;
  --surface-2:#1D222C;
  --ink:#E9EBF0;
  --ink-soft:#A7AFBF;
  --ink-faint:#6B7383;
  --accent:#7C97FF;
  --accent-ink:#AEBEFF;
  --accent-soft:#20264A;
  --amber:#E5A757;
  --amber-soft:#3A2C15;
  --success:#4FCB93;
  --success-soft:#123528;
  --danger:#F0836B;
  --danger-soft:#3A1B15;
  --line:#262C38;
  --line-strong:#333B4A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 4px 16px rgba(0,0,0,.4), 0 24px 48px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:var(--accent);}
code,.mono{font-family:var(--font-mono);}
::selection{background:var(--accent-soft); color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* scrollbars */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:4px 8px 20px 8px;
}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-ink));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-mono); font-weight:600; font-size:13px;
  flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-title{font-family:var(--font-display); font-weight:600; font-size:14.5px;}
.brand-sub{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}

.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--radius-s);
  color:var(--ink-soft); background:none; border:none; text-align:left;
  font-size:14px; font-weight:500; width:100%;
  transition:background var(--dur), color var(--dur);
}
.nav-item svg{width:17px; height:17px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink);}
.nav-item .kbd{margin-left:auto; font-size:10px; color:var(--ink-faint); font-family:var(--font-mono);}

.sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
.sidebar-stat{
  background:var(--surface-2); border-radius:var(--radius-m); padding:12px;
  font-size:12px; color:var(--ink-soft);
}
.sidebar-stat b{display:block; font-family:var(--font-display); font-size:19px; color:var(--ink); font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:14px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar h1{font-size:18px; font-weight:600;}
.topbar-sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
.search-box{
  flex:1; max-width:380px; margin-left:auto;
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:8px 10px;
}
.search-box input{
  border:none; background:none; outline:none; width:100%;
  font-size:13.5px; color:var(--ink); font-family:var(--font-body);
}
.search-box svg{width:15px; height:15px; color:var(--ink-faint); flex-shrink:0;}
.search-box .kbd{font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); border:1px solid var(--line); border-radius:4px; padding:1px 5px;}

.icon-btn{
  width:34px; height:34px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); flex-shrink:0;
  transition:background var(--dur), color var(--dur), border-color var(--dur);
}
.icon-btn svg{width:16px; height:16px;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}

.content{padding:24px 28px 60px 28px; max-width:1180px; width:100%; margin:0 auto;}

/* ============================================================
   BUTTONS / BADGES / FORMS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  border-radius:var(--radius-s); border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500;
  padding:9px 14px; transition:background var(--dur), border-color var(--dur), transform var(--dur);
}
.btn svg{width:15px; height:15px;}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
.btn-ghost{background:none; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft); filter:brightness(0.95);}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.btn-block{width:100%; justify-content:center;}

.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px;
  font-family:var(--font-mono); letter-spacing:.01em;
}
.badge-accent{background:var(--accent-soft); color:var(--accent-ink);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-success{background:var(--success-soft); color:var(--success);}
.badge-muted{background:var(--surface-2); color:var(--ink-soft);}

label.field-label{
  display:flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:5px;
}
.field-help{font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:-2px; margin-bottom:6px; line-height:1.4;}
input[type=text], textarea, select{
  width:100%; border:1px solid var(--line); background:var(--surface);
  border-radius:var(--radius-s); padding:9px 11px; font-size:13.5px;
  font-family:var(--font-body); color:var(--ink); resize:vertical;
}
textarea{min-height:74px; line-height:1.5;}
input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent);}
.field{margin-bottom:16px;}
.check-row{display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-bottom:1px solid var(--line);}
.check-row:last-child{border-bottom:none;}
.check-row input{margin-top:3px; accent-color:var(--accent);}
.check-row .ct{font-size:13px; font-weight:500;}
.check-row .cd{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}

/* ============================================================
   CARDS / GRID
   ============================================================ */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform var(--dur), border-color var(--dur);
  animation:cardIn .28s ease both;
}
@keyframes cardIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.card:hover{border-color:var(--line-strong);}
.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.card-title{font-family:var(--font-display); font-size:15.5px; font-weight:600;}
.card-desc{font-size:13px; color:var(--ink-soft); flex:1;}
.card-tags{display:flex; gap:6px; flex-wrap:wrap;}
.card-actions{display:flex; gap:6px; margin-top:4px;}
.star-btn{background:none; border:none; color:var(--ink-faint); padding:2px;}
.star-btn svg{width:17px; height:17px;}
.star-btn.active{color:var(--amber);}
.star-btn.active svg{fill:var(--amber);}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-display); font-size:26px; font-weight:600;}
.stat-label{font-size:12px; color:var(--ink-faint); margin-top:2px;}

/* explainer banner */
.banner{
  background:linear-gradient(135deg,var(--accent-soft), var(--surface) 70%);
  border:1px solid var(--line); border-radius:var(--radius-l);
  padding:20px 22px; margin-bottom:22px; position:relative;
  background-image:
    radial-gradient(circle, var(--line) 1px, transparent 1px);
  background-size:16px 16px;
  background-position:-6px -6px;
}
html[data-theme="dark"] .banner{background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);}
.banner-close{position:absolute; top:14px; right:14px;}
.banner h2{font-size:16.5px; margin-bottom:8px; max-width:640px;}
.banner p{font-size:13.5px; color:var(--ink-soft); max-width:640px;}
.banner-steps{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.banner-step{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s);
  padding:9px 12px; font-size:12px; display:flex; align-items:center; gap:8px; max-width:230px;
}
.banner-step .n{
  font-family:var(--font-mono); font-weight:700; color:var(--accent-ink);
  background:var(--accent-soft); width:20px; height:20px; border-radius:6px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px;
}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 12px 0; flex-wrap:wrap; gap:8px;}
.section-head h3{font-size:15px;}
.section-head p{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-faint);
  border:1.5px dashed var(--line); border-radius:var(--radius-l);
}
.empty-state svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty-state h4{font-size:14.5px; color:var(--ink-soft); margin-bottom:4px;}
.empty-state p{font-size:12.5px; max-width:340px; margin:0 auto;}

/* tabs / filter chips */
.chip-row{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px;}
.chip{
  padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-soft);
  transition:background var(--dur), color var(--dur), border-color var(--dur);
}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
html[data-theme="dark"] .chip.active{background:var(--accent); border-color:var(--accent); color:#0D1015;}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,12,16,.5); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;
  z-index:100; overflow-y:auto; animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-lg);
  width:100%; max-width:640px; border:1px solid var(--line);
  animation:modalIn .22s cubic-bezier(.2,.8,.2,1);
  max-height:90vh; display:flex; flex-direction:column;
}
.modal.modal-wide{max-width:820px;}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px; border-bottom:1px solid var(--line); flex-shrink:0;
}
.modal-header h3{font-size:16px;}
.modal-body{padding:20px 22px; overflow-y:auto;}
.modal-footer{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0;}

/* variable fill + preview */
.var-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
@media(max-width:640px){.var-grid{grid-template-columns:1fr;}}
.preview-box{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px; font-family:var(--font-mono); font-size:12.5px; white-space:pre-wrap;
  line-height:1.65; max-height:340px; overflow-y:auto; color:var(--ink);
}
.preview-box .filled{color:var(--ink);}
.preview-box .empty-var{color:var(--danger); background:var(--danger-soft); padding:0 3px; border-radius:3px;}
.copy-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.copy-bar .lbl{font-size:12px; font-weight:600; color:var(--ink-soft);}

/* ============================================================
   PROMPT BUILDER
   ============================================================ */
.pb-layout{display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start;}
@media(max-width:980px){.pb-layout{grid-template-columns:1fr;}}
.block-picker{display:flex; flex-direction:column; gap:10px;}
.block-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px; box-shadow:var(--shadow);
  background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);
  background-size:14px 14px; background-position:-4px -4px;
}
.block-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.block-num{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--accent-ink);
  background:var(--accent-soft); width:22px; height:22px; border-radius:6px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.block-title{font-family:var(--font-display); font-weight:600; font-size:14.5px;}
.block-optional{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); margin-left:auto;}
.block-desc{font-size:12px; color:var(--ink-faint); margin:2px 0 10px 32px; max-width:520px;}
.block-body{margin-left:32px;}
.quick-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.quick-tag{
  font-size:11px; padding:4px 9px; border-radius:99px; background:var(--surface-2);
  border:1px solid var(--line); color:var(--ink-soft); font-family:var(--font-mono);
}
.quick-tag:hover{border-color:var(--accent); color:var(--accent-ink);}
.check-grid{display:grid; grid-template-columns:1fr 1fr; gap:2px 14px;}
@media(max-width:520px){.check-grid{grid-template-columns:1fr;}}

.pb-preview{position:sticky; top:80px;}
.blueprint{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l);
  box-shadow:var(--shadow); overflow:hidden;
}
.blueprint-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--line);
}
.blueprint-head h4{font-size:13.5px;}
.blueprint-body{padding:16px;}

/* ============================================================
   MISC
   ============================================================ */
.toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px;
  font-size:13px; font-weight:500; box-shadow:var(--shadow-lg);
  animation:toastIn .22s ease, toastOut .22s ease 1.8s forwards;
  display:flex; align-items:center; gap:8px;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastOut{to{opacity:0; transform:translateY(8px);}}

.help-btn{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  color:var(--ink-soft);
}
.kbd-tag{font-family:var(--font-mono); font-size:10.5px; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--ink-faint);}

.shortcut-grid{display:grid; grid-template-columns:1fr auto; row-gap:10px; column-gap:14px; align-items:center;}
.shortcut-grid .k{font-family:var(--font-mono); font-size:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:4px 9px;}

.divider{height:1px; background:var(--line); margin:16px 0;}
.mini-note{font-size:11.5px; color:var(--ink-faint); display:flex; gap:6px; align-items:flex-start; background:var(--surface-2); padding:10px 12px; border-radius:var(--radius-s);}
.mini-note svg{width:14px; height:14px; flex-shrink:0; margin-top:1px;}

@media(max-width:880px){
  .sidebar{position:fixed; left:-260px; z-index:90; transition:left var(--dur); box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .topbar{padding:12px 16px;}
  .content{padding:18px 16px 60px 16px;}
  .search-box{max-width:none;}
  .menu-btn{display:flex !important;}
}
.menu-btn{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   ICONS (minimal inline SVG set)
   ============================================================ */
const ICON = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  workflows:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="17" cy="12" r="2.4"/><path d="M7 6h4a3 3 0 0 1 3 3v0"/><path d="M7 18h4a3 3 0 0 0 3-3v0"/></svg>',
  builder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="6" rx="1.5"/><rect x="13" y="4" width="8" height="6" rx="1.5"/><rect x="3" y="14" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/></svg>',
  loop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',

const STORE_KEY = 'aiPlaybook.v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    theme:'light',
    onboardingSeen:false,
    bannerDismissed:false,
    favorites:[],
    customWorkflows:[],
    view:'dashboard',
  };
}
let state = loadState();
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function allWorkflows(){
  return [...SEED_WORKFLOWS, ...state.customWorkflows];
}
function getWorkflow(id){
  return allWorkflows().find(w=>w.id===id);
}

/* ============================================================
   UTIL
   ============================================================ */
function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,9); }
function esc(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function extractVars(template){
  const re = /\{\{(\w+)\}\}/g; let m; const found=[];
  while((m=re.exec(template))){ if(!found.includes(m[1])) found.push(m[1]); }
  return found;
}
function renderTemplate(template, values){
  return template.replace(/\{\{(\w+)\}\}/g, (m,key)=>{
    const v = values[key];
    return (v && v.trim()) ? v : m;
  });
}
function copyToClipboard(text, label){
  navigator.clipboard.writeText(text).then(()=>toast((label||'Prompt')+' copied to clipboard', ICON.check))
    .catch(()=>toast('Could not copy — select and copy manually', ICON.info));
}
function toast(msg, icon){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = (icon||ICON.check)+`<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2100);
}

/* ---------------- PROMPT BUILDER ---------------- */
function pbBuildText(){
  const p = ui.pb;
  let out = '';
  if(p.role) out += `# Role\n${p.role}\n\n`;
  if(p.objective) out += `# Objective\n${p.objective}\n\n`;
  if(p.context) out += `# Context\n${p.context}\n\n`;
  const constraints = [...p.constraints];
  if(p.constraintsCustom.trim()) constraints.push(p.constraintsCustom.trim());
  if(constraints.length) out += `# Constraints\n${constraints.map(c=>'- '+c).join('\n')}\n\n`;
  if(p.reasoning) out += `# Reasoning Strategy\n${p.reasoning}\n\n`;
  if(p.output) out += `# Output Format\n${p.output}\n\n`;
  if(p.tone) out += `# Tone\n${p.tone}\n\n`;
  if(p.examples) out += `# Example\n${p.examples}\n\n`;
  if(p.quality.length) out += `# Before You Answer\n${p.quality.map(q=>'- '+q).join('\n')}\n\n`;
  return out.trim();
}

function renderPromptBuilder(){
  const p = ui.pb;

  const text = pbBuildText();

function renderPBBlock(b,i){
  const p = ui.pb;
  let body='';
  if(b.type==='select-or-text'){
    body = `
      <div class="quick-row">
        ${b.options.map(o=>`<button class="quick-tag" data-pb-set="${b.key}" data-val="${esc(o.v)}">${esc(o.l)}</button>`).join('')}
      </div>
      <textarea data-pb-field="${b.key}" placeholder="Or write your own...">${esc(p[b.key])}</textarea>`;
  } else if(b.type==='textarea'){
    body = `
      ${b.quick?`<div class="quick-row">${b.quick.map(o=>`<button class="quick-tag" data-pb-prepend="${b.key}" data-val="${esc(o.v)}">${esc(o.l)}</button>`).join('')}</div>`:''}
      <textarea data-pb-field="${b.key}" placeholder="${esc(b.placeholder||'')}">${esc(p[b.key])}</textarea>`;
  } else if(b.type==='select'){
    body = `<select data-pb-field="${b.key}">
      <option value="">— none —</option>
      ${b.options.map(o=>`<option value="${esc(o.v)}" ${p[b.key]===o.v?'selected':''}>${esc(o.l)}</option>`).join('')}
    </select>`;
  } else if(b.type==='multiselect'){
    body = `<div class="check-grid">${b.options.map((o,oi)=>`
      <label class="check-row" style="border:none; padding:5px 0;">
        <input type="checkbox" data-pb-multi="${b.key}" value="${esc(o)}" ${p[b.key].includes(o)?'checked':''}>
        <span class="ct" style="font-weight:400;">${esc(o)}</span>
      </label>`).join('')}</div>
      ${b.key==='constraints'?`<textarea style="margin-top:8px;" placeholder="Add your own constraint..." data-pb-field="constraintsCustom">${esc(p.constraintsCustom)}</textarea>`:''}`;
  }
  return `
  <div class="block-card">
    <div class="block-head">
      <span class="block-num">${i+1}</span>
      <span class="block-title">${b.title}</span>
      <span class="block-optional">${b.optional?'optional':'recommended'}</span>
    </div>
    <p class="block-desc">${b.desc}</p>
    <div class="block-body">${body}</div>
  </div>`;
}

/* ---------------- LOOP BUILDER ---------------- */
function lbBuildText(){
  const l = ui.lb;
  let out = `You are running in an autonomous loop. Keep iterating until the goal is met or a stop condition is hit.\n\n`;
  if(l.base) out += `# Base Task\n${l.base}\n\n`;
  if(l.goal) out += `# Goal (Definition of Done)\n${l.goal}\n\n`;
  if(l.eval.length) out += `# Evaluation Criteria\nAfter each attempt, check:\n${l.eval.map(e=>'- '+e).join('\n')}\n\n`;
  if(l.improve) out += `# Improvement Strategy\nIf evaluation fails:\n${l.improve}\n\n`;
  if(l.stop.length) out += `# Stop Conditions\nStop looping when:\n${l.stop.map(e=>'- '+e).join('\n')}\n\n`;
  if(l.safety.length) out += `# Safety Rules\nNever:\n${l.safety.map(e=>'- '+e).join('\n')}\n\n`;
  return out.trim();
}

function renderLoopBuilder(){
  const l = ui.lb;
  const blocks = LB_BLOCKS.map((b,i)=>renderLBBlock(b,i)).join('');
  const text = lbBuildText();
  return `
  <div class="mini-note">${ICON.info} A <b>loop prompt</b> asks Claude to keep working on a task, check its own progress against criteria you set, and stop on its own — useful for tasks with a clear pass/fail check, like "make these tests pass."</div>

      </div>
    </div>
  </div>`;
}

function renderLBBlock(b,i){
  const l = ui.lb;
  let body='';
  if(b.type==='textarea'){
    body = `<textarea data-lb-field="${b.key}" placeholder="${esc(b.placeholder||'')}">${esc(l[b.key])}</textarea>`;
  } else if(b.type==='select'){
    body = `<select data-lb-field="${b.key}">
      <option value="">— none —</option>
      ${b.options.map(o=>`<option value="${esc(o.v)}" ${l[b.key]===o.v?'selected':''}>${esc(o.l)}</option>`).join('')}
    </select>`;
  } else if(b.type==='multiselect'){
    body = `<div class="check-grid" style="grid-template-columns:1fr;">${b.options.map(o=>`
      <label class="check-row" style="border:none; padding:5px 0;">
        <input type="checkbox" data-lb-multi="${b.key}" value="${esc(o)}" ${l[b.key].includes(o)?'checked':''}>

  }
  return `
  <div class="block-card">
    <div class="block-head">
      <span class="block-num">${i+1}</span>
      <span class="block-title">${b.title}</span>
      <span class="block-optional">${b.optional?'optional':'recommended'}</span>
    </div>
    <p class="block-desc">${b.desc}</p>
    <div class="block-body">${body}</div>
  </div>`;
}

        <textarea id="importText" style="min-height:180px; font-family:var(--font-mono); font-size:12px;" placeholder="Paste exported JSON here..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn btn-primary" data-action="confirm-import">Import</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> setView(el.getAttribute('data-nav')));
  });
  const themeBtn = document.querySelector('[data-action="toggle-theme"]');
  if(themeBtn) themeBtn.addEventListener('click', ()=>{
    state.theme = state.theme==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    saveState(); render();
  });
  const menuBtn = document.querySelector('[data-action="toggle-mobile-nav"]');
  if(menuBtn) menuBtn.addEventListener('click', ()=>{ ui.mobileNavOpen=!ui.mobileNavOpen; render(); });

  document.querySelectorAll('[data-action="open-help"]').forEach(el=>el.addEventListener('click', ()=>{ ui.modal='help'; render(); }));
  document.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ ui.modal=null; ui.modalData=null; render(); } }));
  document.querySelectorAll('.modal-header [data-close-modal], .modal-footer [data-close-modal]').forEach(el=>el.addEventListener('click', ()=>{ ui.modal=null; ui.modalData=null; render(); }));

  const bannerClose = document.querySelector('[data-action="dismiss-banner"]');
  if(bannerClose) bannerClose.addEventListener('click', ()=>{ state.bannerDismissed=true; saveState(); render(); });

  document.querySelectorAll('[data-action="goto-category"]').forEach(el=>el.addEventListener('click', ()=>{
    ui.filterCat = el.getAttribute('data-cat'); ui.filterFav=false; setView('workflows');
  }));

  // search
  const search = document.getElementById('globalSearch');
  if(search) search.addEventListener('input', (e)=>{ ui.search = e.target.value; renderWorkflowsOnly(); });

  // filters
  document.querySelectorAll('[data-filter-cat]').forEach(el=>el.addEventListener('click', ()=>{
    ui.filterCat = el.getAttribute('data-filter-cat'); render();
  }));
  const favFilter = document.querySelector('[data-toggle-fav-filter]');
  if(favFilter) favFilter.addEventListener('click', ()=>{ ui.filterFav = !ui.filterFav; render(); });

  // favorite toggle
  document.querySelectorAll('[data-action="toggle-fav"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    const idx = state.favorites.indexOf(id);
    if(idx>-1) state.favorites.splice(idx,1); else state.favorites.push(id);
    saveState(); render();
  }));

  // open workflow (fill)
  document.querySelectorAll('[data-action="open-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    ui.modal='fill'; ui.modalData={id, values:{}}; render();
  }));

  // duplicate
  document.querySelectorAll('[data-action="duplicate-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const w = getWorkflow(el.getAttribute('data-id'));
    if(!w) return;
    const copy = {...w, id:uid('wf'), isTemplate:false, title:w.title+' (copy)'};
    state.customWorkflows.push(copy); saveState(); render();
    toast('Duplicated to My Library');
  }));

  // delete
  document.querySelectorAll('[data-action="delete-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    state.customWorkflows = state.customWorkflows.filter(w=>w.id!==id);
    const fi = state.favorites.indexOf(id); if(fi>-1) state.favorites.splice(fi,1);
    saveState(); render();
    toast('Workflow deleted');
  }));

  // edit
  document.querySelectorAll('[data-action="edit-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const w = getWorkflow(el.getAttribute('data-id'));
    ui.modal='edit'; ui.modalData={...w}; render();
  }));

  // new workflow
  const newBtn = document.querySelector('[data-action="new-workflow"]');
  if(newBtn) newBtn.addEventListener('click', ()=>{ ui.modal='edit'; ui.modalData={title:'', category:'writing', desc:'', template:''}; render(); });

  // edit modal live var detection
  const edTemplate = document.getElementById('ed-template');
  if(edTemplate){
    const updateVars = ()=>{
      const vars = extractVars(edTemplate.value);
      document.getElementById('ed-varlist').textContent = vars.length ? vars.map(v=>'{{'+v+'}}').join(', ') : 'none yet';
    };
    edTemplate.addEventListener('input', updateVars);
    updateVars();
  }
  const saveWfBtn = document.querySelector('[data-action="save-workflow"]');
  if(saveWfBtn) saveWfBtn.addEventListener('click', ()=>{
    const title = document.getElementById('ed-title').value.trim();
    const category = document.getElementById('ed-category').value;
    const desc = document.getElementById('ed-desc').value.trim();
    const template = document.getElementById('ed-template').value;
    if(!title || !template.trim()){ toast('Add a title and a template first'); return; }
    const vars = extractVars(template).map(k=>({key:k, label:k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), type:'textarea'}));
    const id = saveWfBtn.getAttribute('data-id');
    if(id){
      const idx = state.customWorkflows.findIndex(w=>w.id===id);
      if(idx>-1) state.customWorkflows[idx] = {...state.customWorkflows[idx], title, category, desc, template, vars, tags:[]};
    } else {
      state.customWorkflows.push({id:uid('wf'), isTemplate:false, title, category, desc, template, vars, tags:[]});
    }
    saveState(); ui.modal=null; ui.modalData=null; render();
    toast('Workflow saved');
  });

  // fill modal var inputs
  document.querySelectorAll('[data-fill-var]').forEach(el=>el.addEventListener('input', ()=>{
    ui.modalData.values[el.getAttribute('data-fill-var')] = el.value;
    updateFillPreview();
  }));
  const copyFillBtn = document.querySelector('[data-action="copy-fill"]');
  if(copyFillBtn) copyFillBtn.addEventListener('click', ()=>{
    const w = getWorkflow(ui.modalData.id);
    copyToClipboard(renderTemplate(w.template, ui.modalData.values), 'Prompt');
  });
  const dupFromFill = document.querySelector('[data-action="duplicate-from-fill"]');
  if(dupFromFill) dupFromFill.addEventListener('click', ()=>{
    const w = getWorkflow(ui.modalData.id);
    const filled = renderTemplate(w.template, ui.modalData.values);
    const copy = {id:uid('wf'), isTemplate:false, category:w.category, title:w.title+' (filled copy)', desc:w.desc, template:filled, vars:[], tags:w.tags||[]};
    state.customWorkflows.push(copy); saveState();
    ui.modal=null; ui.modalData=null; render();
    toast('Saved to My Library');
  });

  // import/export
  const expBtn = document.querySelector('[data-action="export-data"]');
  if(expBtn) expBtn.addEventListener('click', ()=>{
    const data = JSON.stringify({customWorkflows:state.customWorkflows, favorites:state.favorites}, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ai-playbook-export.json'; a.click();
    toast('Exported');
  });
  const impBtn = document.querySelector('[data-action="import-data"]');
  if(impBtn) impBtn.addEventListener('click', ()=>{ ui.modal='import'; render(); });
  const confirmImport = document.querySelector('[data-action="confirm-import"]');
  if(confirmImport) confirmImport.addEventListener('click', ()=>{
    try{
      const parsed = JSON.parse(document.getElementById('importText').value);
      if(parsed.customWorkflows){
        parsed.customWorkflows.forEach(w=>{ w.id = uid('wf'); w.isTemplate=false; state.customWorkflows.push(w); });
      }
      saveState(); ui.modal=null; ui.modalData=null; render();
      toast('Import successful');
    }catch(e){ toast('That JSON could not be read'); }
  });

  // Prompt Builder events
  document.querySelectorAll('[data-pb-field]').forEach(el=>el.addEventListener('input', ()=>{
    ui.pb[el.getAttribute('data-pb-field')] = el.value; updatePBPreview();
  }));
  document.querySelectorAll('[data-pb-set]').forEach(el=>el.addEventListener('click', ()=>{
    ui.pb[el.getAttribute('data-pb-set')] = el.getAttribute('data-val'); render();
  }));
  document.querySelectorAll('[data-pb-prepend]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.getAttribute('data-pb-prepend');
    ui.pb[key] = el.getAttribute('data-val') + (ui.pb[key]||'');
    render();
  }));
  document.querySelectorAll('[data-pb-multi]').forEach(el=>el.addEventListener('change', ()=>{
    const key = el.getAttribute('data-pb-multi'); const val = el.value;
    const arr = ui.pb[key];
    const idx = arr.indexOf(val);
    if(el.checked && idx===-1) arr.push(val);
    if(!el.checked && idx>-1) arr.splice(idx,1);
    updatePBPreview();
  }));
  const copyPbBtn = document.querySelector('[data-action="copy-pb"]');
  if(copyPbBtn) copyPbBtn.addEventListener('click', ()=> copyToClipboard(pbBuildText(), 'Prompt'));
  const sendToLoop = document.querySelector('[data-action="send-to-loop"]');
  if(sendToLoop) sendToLoop.addEventListener('click', ()=>{
    ui.lb.base = pbBuildText();
    setView('loopBuilder');
  });

  // Loop Builder events
  document.querySelectorAll('[data-lb-field]').forEach(el=>el.addEventListener('input', ()=>{
    ui.lb[el.getAttribute('data-lb-field')] = el.value; updateLBPreview();
  }));
  document.querySelectorAll('[data-lb-multi]').forEach(el=>el.addEventListener('change', ()=>{
    const key = el.getAttribute('data-lb-multi'); const val = el.value;
    const arr = ui.lb[key]; const idx = arr.indexOf(val);
    if(el.checked && idx===-1) arr.push(val);
    if(!el.checked && idx>-1) arr.splice(idx,1);
    updateLBPreview();
  }));
  const copyLbBtn = document.querySelector('[data-action="copy-lb"]');
  if(copyLbBtn) copyLbBtn.addEventListener('click', ()=> copyToClipboard(lbBuildText(), 'Loop prompt'));

  const importFileInput = document.getElementById('importFile');
  if(importFileInput) importFileInput.addEventListener('change', ()=>{});
}

// lightweight partial re-renders to keep focus/cursor in text inputs
function updatePBPreview(){
  const box = document.querySelector('.pb-preview .preview-box');
  if(box){
    const text = pbBuildText();
    box.innerHTML = text ? esc(text) : '<span style="color:var(--ink-faint)">Your assembled prompt will appear here as you fill in the blocks on the left.</span>';
  }
}
function updateLBPreview(){
  const box = document.querySelector('.pb-preview .preview-box');
  if(box) box.innerHTML = esc(lbBuildText());
}
function updateFillPreview(){
  const w = getWorkflow(ui.modalData.id);
  const values = ui.modalData.values;
  const box = document.querySelector('.modal .preview-box');
  if(box){
    box.innerHTML = esc(w.template).replace(/\{\{(\w+)\}\}/g, (m,key)=>{
      const v = values[key];
      return (v && v.trim()) ? esc(v) : `<span class="empty-var">${m}</span>`;
    });
  }
}
function renderWorkflowsOnly(){
  const content = document.querySelector('.content');
  if(content) content.innerHTML = renderWorkflowsView();
  attachContentOnlyEvents();
  const s = document.getElementById('globalSearch');
  if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

// Binds only the events that live inside .content — used after a partial
// re-render (e.g. live search) so we never double-bind sidebar/topbar listeners.
function attachContentOnlyEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> setView(el.getAttribute('data-nav')));
  });
  document.querySelectorAll('[data-action="goto-category"]').forEach(el=>el.addEventListener('click', ()=>{
    ui.filterCat = el.getAttribute('data-cat'); ui.filterFav=false; setView('workflows');
  }));
  document.querySelectorAll('[data-filter-cat]').forEach(el=>el.addEventListener('click', ()=>{

  const favFilter = document.querySelector('[data-toggle-fav-filter]');
  if(favFilter) favFilter.addEventListener('click', ()=>{ ui.filterFav = !ui.filterFav; render(); });
  document.querySelectorAll('[data-action="toggle-fav"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    const idx = state.favorites.indexOf(id);
    if(idx>-1) state.favorites.splice(idx,1); else state.favorites.push(id);
    saveState(); render();
  }));
  document.querySelectorAll('[data-action="open-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    ui.modal='fill'; ui.modalData={id, values:{}}; render();
  }));
  document.querySelectorAll('[data-action="duplicate-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const w = getWorkflow(el.getAttribute('data-id'));
    if(!w) return;
    const copy = {...w, id:uid('wf'), isTemplate:false, title:w.title+' (copy)'};
    state.customWorkflows.push(copy); saveState(); render();
    toast('Duplicated to My Library');
  }));
  document.querySelectorAll('[data-action="delete-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-id');
    state.customWorkflows = state.customWorkflows.filter(w=>w.id!==id);
    const fi = state.favorites.indexOf(id); if(fi>-1) state.favorites.splice(fi,1);
    saveState(); render();
    toast('Workflow deleted');
  }));
  document.querySelectorAll('[data-action="edit-workflow"]').forEach(el=>el.addEventListener('click', ()=>{
    const w = getWorkflow(el.getAttribute('data-id'));
    ui.modal='edit'; ui.modalData={...w}; render();
  }));
  const newBtn = document.querySelector('[data-action="new-workflow"]');
  if(newBtn) newBtn.addEventListener('click', ()=>{ ui.modal='edit'; ui.modalData={title:'', category:'writing', desc:'', template:''}; render(); });
  const expBtn = document.querySelector('[data-action="export-data"]');
  if(expBtn) expBtn.addEventListener('click', ()=>{
    const data = JSON.stringify({customWorkflows:state.customWorkflows, favorites:state.favorites}, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ai-playbook-export.json'; a.click();
    toast('Exported');
  });
  const impBtn = document.querySelector('[data-action="import-data"]');
  if(impBtn) impBtn.addEventListener('click', ()=>{ ui.modal='import'; render(); });
}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select';
  if(e.key==='Escape'){ if(ui.modal){ ui.modal=null; ui.modalData=null; render(); } return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); setView('workflows'); setTimeout(()=>{ const s=document.getElementById('globalSearch'); if(s) s.focus(); },30); return; }
  if(e.key==='?'){ ui.modal='help'; render(); return; }
  if(e.key==='1'){ setView('dashboard'); }
  if(e.key==='2'){ setView('workflows'); }
  if(e.key==='3'){ setView('promptBuilder'); }
  if(e.key==='4'){ setView('loopBuilder'); }
});

/* ============================================================
   INIT
   ============================================================ */
document.documentElement.setAttribute('data-theme', state.theme);
if(!state.onboardingSeen){ state.onboardingSeen = true; saveState(); ui.modal='help'; }
render();
</script>
